# Gitea for git-fetch verification (throwaway: emptyDir, no PVC)
apiVersion: v1
kind: Namespace
metadata:
  name: gitea
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: gitea
spec:
  replicas: 1
  selector:
    matchLabels: {app: gitea}
  template:
    metadata:
      labels: {app: gitea}
    spec:
      containers:
        - name: gitea
          image: gitea/gitea:latest
          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            - name: GITEA__server__DOMAIN
              value: gitea.gitea.svc.cluster.local
            - name: GITEA__server__ROOT_URL
              value: http://gitea.gitea.svc.cluster.local:3000/
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 22
              name: ssh
          readinessProbe:
            httpGet: {path: /, port: 3000}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: gitea
spec:
  type: NodePort
  selector: {app: gitea}
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30300
