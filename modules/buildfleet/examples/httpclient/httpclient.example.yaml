# httpclient 配置示例（-config 指定；复制为 httpclient.yaml 使用）
server: http://127.0.0.1:8484
dockerfile: Dockerfile      # 相对 context 根的路径

http:
  url: http://files.example.com/team/app-1.0.tar.gz
  # url: http://files.example.com/team/Dockerfile   # 单文件也支持（context 只含该文件，
  #                                                  # 常配合 dockerfile 内联内容）
  mode: server               # server（daemon 侧下载）| runtime（buildkitd 侧下载）
  auth: "user:pass"          # 明文（本机调试用）；两种模式均生效（runtime 模式经 session 下发）
  # authEnv: HTTP_AUTH       # 或环境变量（推荐），值为 "user:pass" 或裸 token（Bearer）

push:
  ref: 192.168.107.2:5000/app:latest
  # auth: "user:pass"
  # authEnv: PUSH_AUTH

resources:                  # 0/空 = 最小档位；会被向上取整到档位（1/2/4C, 2/4/8Gi）
  cpu: 4
  memory: 8Gi
