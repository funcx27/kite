# gitclient 配置示例（-config 指定；复制为 gitclient.yaml 使用）
server: http://127.0.0.1:8484
dockerfile: Dockerfile      # 相对 context 根的路径

git:
  url: http://gitlab.example.com/team/app.git
  ref: master               # 分支 / tag / SHA；空 = HEAD
  subdir: ""                # 仓库内 context 根
  mode: server               # server（daemon 侧下载）| runtime（buildkitd 侧下载）
  auth: "user:pass"         # 明文（本机调试用）
  # authEnv: GIT_AUTH       # 或环境变量（推荐），值为 "user:pass"

push:
  ref: 192.168.107.2:5000/app:latest
  # auth: "user:pass"
  # authEnv: PUSH_AUTH

resources:                  # 0/空 = 最小档位；会被向上取整到档位（1/2/4C, 2/4/8Gi）
  cpu: 4
  memory: 8Gi
